# Decap CMS – https://decapcms.org/docs/configuration-options/
#
# Content is committed straight to the GitHub repository. Authentication runs
# through the Cloudflare Pages Functions in /functions/api (GitHub OAuth app,
# see DEPLOY.md). For local editing run `bun run cms:local` next to
# `bun run dev` and open http://localhost:4321/admin/.

backend:
  name: github
  repo: PeterMusil2/anewstyle
  branch: master
  base_url: https://anewstyle.cz
  auth_endpoint: api/auth
  commit_messages:
    create: "content({{collection}}): create {{slug}}"
    update: "content({{collection}}): update {{slug}}"
    delete: "content({{collection}}): delete {{slug}}"
    uploadMedia: "content(media): upload {{path}}"
    deleteMedia: "content(media): delete {{path}}"

# Changes go through draft → review → ready; publishing merges a pull
# request, so Cloudflare builds a preview of every draft first.
publish_mode: editorial_workflow
local_backend: true

locale: cs
site_url: https://anewstyle.cz
display_url: https://anewstyle.cz
logo_url: /images/logos/logo.svg

# Gallery photos and 360° panoramas are watermarked and compressed in the
# browser and committed to this repository (public/media/, see
# public/admin/media-upload.js). Gallery videos and the product fields go to
# Cloudinary through our own upload dialog (public/admin/cloudinary-upload.js
# + functions/api/cloudinary.ts): editors only need their CMS login, no
# Cloudinary account. Product fields set a fixed `folder.path`.
media_library:
  name: anewstyle-cloudinary

# Required by Decap even with an external media library (fallback only).
media_folder: public/images/uploads
public_folder: /images/uploads


# Collections follow the website: Galerie, Vzory kamene, Ceník, Časté dotazy.
collections:
- name: gallery
  label: Galerie
  description: Stránka Galerie (anewstyle.cz/gallery) – fotky, videa a 360° prohlídky. Bonusový obsah
    uvidí návštěvník po odeslání kontaktního formuláře.
  editor:
    preview: false
  files:
  - name: gallery
    label: Galerie webu
    file: src/data/gallery-cms.json
    fields:
    - name: media
      label: Fotky, videa a 360°
      widget: gallery-manager
- name: products
  label: Vzory kamene
  description: Sekce „Produkty“ na úvodní stránce. Pořadí změníte přetažením karty za úchyt (⠿). Kliknutím
    na kartu ji rozbalíte a upravíte.
  editor:
    preview: false
  files:
  - name: products
    label: Vzory kamene
    file: src/data/products.json
    fields:
    - name: items
      label: Vzory
      label_singular: vzor kamene
      widget: list
      collapsed: true
      summary: '{{fields.title}}'
      add_to_top: false
      fields:
      - name: title
        label: Název vzoru
        widget: string
        hint: Zobrazí se na kartě, např. PINK.
      - name: imgLight
        label: Fotka – svítící panel
        widget: media-image
        media_library:
          config:
            folder:
              path: AnewStyle/Products
        hint: Hlavní fotka na kartě vzoru.
      - name: imgDark
        label: Fotka – zhaslý panel
        widget: media-image
        media_library:
          config:
            folder:
              path: AnewStyle/Products
        required: false
        hint: Další snímek v galerii vzoru.
      - name: imgFrame
        label: Fotka – svítící rám
        widget: media-image
        media_library:
          config:
            folder:
              path: AnewStyle/Products
        required: false
        hint: Další snímek v galerii vzoru.
      - name: modelHorizontal3d
        label: 3D model na šířku
        widget: media-file
        required: false
        hint: 3D model ve formátu .glb – zobrazí se v náhledu karty a v AR „Zobraz u mě doma“.
        media_library:
          config:
            folder:
              path: AnewStyle/Products/3D
      - name: modelVertical3d
        label: 3D model na výšku
        widget: media-file
        required: false
        hint: 3D model ve formátu .glb – zobrazí se v náhledu karty a v AR „Zobraz u mě doma“.
        media_library:
          config:
            folder:
              path: AnewStyle/Products/3D
- name: prices
  label: Ceník
  description: Sekce „Ceník“ na úvodní stránce – ceny podle velikosti a výbava jednotlivých verzí (SLIM,
    BASIC, DELUXE).
  editor:
    preview: false
  files:
  - name: prices
    label: Ceník a výbava
    file: src/data/prices.json
    description: Ceny jsou v Kč bez DPH, např. „18 600“. Pořadí verzí odpovídá pořadí v ceníku.
    fields:
    - name: products
      label: Provedení
      label_singular: Provedení
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: Název
        widget: string
      - name: tagline
        label: Krátký popis
        widget: object
        fields:
        - name: cs
          label: Česky
          widget: string
        - name: en
          label: English
          widget: string
      - name: prices
        label: Ceny podle velikosti
        widget: object
        fields:
        - name: l
          label: L – 2400 × 400 mm
          widget: string
        - name: xl
          label: XL – 2400 × 600 mm
          widget: string
        - name: xxl
          label: XXL – 2400 × 800 mm
          widget: string
        - name: xxxl
          label: XXXL – 2400 × 1200 mm
          widget: string
      - name: features
        label: Výbava
        widget: object
        collapsed: true
        fields:
        - name: '1'
          label: Tloušťka 16 mm
          widget: boolean
        - name: '2'
          label: Tloušťka 34 mm
          widget: boolean
        - name: '3'
          label: Laminováno
          widget: boolean
        - name: '4'
          label: Impregnováno
          widget: boolean
        - name: '5'
          label: Dotykové ovládání
          widget: boolean
        - name: '6'
          label: Zadní podsvícení
          widget: boolean
        - name: '7'
          label: Rychlá montáž
          widget: boolean
        - name: '8'
          label: Vyměnitelné LED
          widget: boolean
        - name: '9'
          label: Zabudovaný zdroj
          widget: boolean
        - name: '10'
          label: Teplota podsvícení
          widget: boolean
        - name: '11'
          label: Dálkové ovládání
          widget: boolean
        - name: '12'
          label: Ovládání telefonem
          widget: boolean
        - name: '13'
          label: Barva rámu RAL
          widget: boolean
- name: faq
  label: Časté dotazy
  description: Sekce „Časté dotazy“ na úvodní stránce.
  editor:
    preview: false
  files:
  - name: faq
    label: Otázky a odpovědi
    file: src/data/faq.json
    description: Tučný text napíšete jako **text**.
    fields:
    - name: items
      label: Otázky
      label_singular: Otázka
      widget: list
      summary: '{{fields.question.cs}}'
      fields:
      - name: question
        label: Otázka
        widget: object
        fields:
        - name: cs
          label: Česky
          widget: string
        - name: en
          label: English
          widget: string
      - name: answer
        label: Odpověď
        widget: object
        fields:
        - name: cs
          label: Česky
          widget: text
        - name: en
          label: English
          widget: text
